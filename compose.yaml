services:
  scaffold-check:
    image: golang:1.25-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command: go run /workspace/scaffold/validate.go
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - app-data:/var/lib/postgresql/data
volumes:
  app-data:
