services:
  scaffold-check:
    image: golang:1.25-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command: go run /workspace/scaffold/validate.go
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - app-data:/var/lib/postgresql/data
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://app:local-dev-only@postgres:5432/app?sslmode=disable
      LISTEN_ADDR: :8080
      FIXTURES_DIR: /app/fixtures
      # 故障注入仅供验收（X-Fault-Inject: rollback 触发写入后回滚）。
      APP_FAULT_INJECTION: "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
  acceptance:
    build: .
    entrypoint: ["/usr/local/bin/acceptance"]
    environment:
      APP_BASE_URL: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    profiles: ["acceptance"]
volumes:
  app-data:
